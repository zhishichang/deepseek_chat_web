name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---- Job 1: 构建验证 ----
  # 每次 push 或 PR 都会运行，确保代码能正常构建
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # 上传构建产物，供 deploy job 使用
      - name: Upload build artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/
          retention-days: 1

  # ---- Job 2: 部署到服务器 ----
  # 仅在 push 到 main 时运行，PR 不会触发部署
  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist/

      - name: Debug SSH key fingerprint
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          echo "=== Key fingerprint in GitHub Secret ==="
          ssh-keygen -y -f /tmp/deploy_key 2>/dev/null || echo "ERROR: Invalid private key format!"
          echo ""
          echo "=== Expected fingerprint (from server) ==="
          echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJCQebetHcmghdOoi02Ir0PkBV8K6Xi53FXZm/yDc9aS github-actions-deploy"
          rm -f /tmp/deploy_key

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "==> 拉取最新代码..."
            git pull origin main

            echo "==> 安装依赖..."
            npm ci

            echo "==> 构建前端..."
            npm run build

            echo "==> 创建日志目录..."
            mkdir -p /var/log/deepseek-chat-web

            echo "==> 重启应用..."
            pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js

            echo "==> 部署完成!"
